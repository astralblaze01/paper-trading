services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: paper
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U paper -d paper']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
  web:
    build: .
    environment:
      DB_HOST: db
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      WEEKLY_ENABLED: ${WEEKLY_ENABLED:-true}
      WEEKLY_DAY: ${WEEKLY_DAY:-5}
      WEEKLY_HOUR: ${WEEKLY_HOUR:-9}
      DAILY_SNAPSHOT_ENABLED: ${DAILY_SNAPSHOT_ENABLED:-true}
      DAILY_SNAPSHOT_HOUR: ${DAILY_SNAPSHOT_HOUR:-7}
      DAILY_SNAPSHOT_RETRY_MINUTES: ${DAILY_SNAPSHOT_RETRY_MINUTES:-120}
      DAILY_SNAPSHOT_MAX_QUOTE_AGE_DAYS: ${DAILY_SNAPSHOT_MAX_QUOTE_AGE_DAYS:-7}
      BENCHMARK_SYMBOLS: ${BENCHMARK_SYMBOLS:-SPY,QQQ,KR:069500}
      KOREA_MARKET_PROVIDER: ${KOREA_MARKET_PROVIDER:-kis}
      KOREA_MARKET_API_KEY: ${KOREA_MARKET_API_KEY:-}
      KOREA_MARKET_API_SECRET: ${KOREA_MARKET_API_SECRET:-}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
      INITIAL_USD: ${INITIAL_USD:-100000}
      TRANSFER_FEE_BPS: ${TRANSFER_FEE_BPS:-10}
      FX_FEE_BPS: ${FX_FEE_BPS:-10}
      FX_SPREAD_BPS: ${FX_SPREAD_BPS:-5}
      US_BUY_FEE_BPS: ${US_BUY_FEE_BPS:-0}
      US_SELL_FEE_BPS: ${US_SELL_FEE_BPS:-0}
      KR_BUY_FEE_BPS: ${KR_BUY_FEE_BPS:-0}
      KR_SELL_FEE_BPS: ${KR_SELL_FEE_BPS:-0}
      KR_SELL_TAX_BPS: ${KR_SELL_TAX_BPS:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      QUOTE_TTL: ${QUOTE_TTL:-15}
      MAX_QUOTE_AGE: ${MAX_QUOTE_AGE:-900}
      US_MAX_QUOTE_AGE: ${US_MAX_QUOTE_AGE:-1800}
      MARKET_CALLS_PER_MINUTE: ${MARKET_CALLS_PER_MINUTE:-50}
      REDIS_URL: redis://redis:6379/0
      MARKET_CACHE_MODE: worker
      QUOTE_SSE_ENABLED: ${QUOTE_SSE_ENABLED:-false}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      QUOTE_SSE_HEARTBEAT: ${QUOTE_SSE_HEARTBEAT:-15}
      QUOTE_SSE_USER_LIMIT: ${QUOTE_SSE_USER_LIMIT:-5}
      QUOTE_SSE_IP_LIMIT: ${QUOTE_SSE_IP_LIMIT:-30}
      US_STREAM_MAX_AGE: ${US_STREAM_MAX_AGE:-10}
      KR_STREAM_MAX_AGE: ${KR_STREAM_MAX_AGE:-10}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  worker:
    build: .
    image: paper-trading-web
    command: [python, -m, app.worker]
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, 'import time,os; assert time.time()-os.stat("/tmp/worker-heartbeat").st_mtime < 300']
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *logging
  market-worker:
    build: .
    image: paper-trading-web
    command: [python, -m, app.market_worker]
    environment:
      REDIS_URL: redis://redis:6379/0
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KOREA_MARKET_PROVIDER: ${KOREA_MARKET_PROVIDER:-kis}
      KOREA_MARKET_API_KEY: ${KOREA_MARKET_API_KEY:-}
      KOREA_MARKET_API_SECRET: ${KOREA_MARKET_API_SECRET:-}
      QUOTE_TTL: ${QUOTE_TTL:-15}
      MAX_QUOTE_AGE: ${MAX_QUOTE_AGE:-900}
      US_MAX_QUOTE_AGE: ${US_MAX_QUOTE_AGE:-1800}
      MARKET_CALLS_PER_MINUTE: ${MARKET_CALLS_PER_MINUTE:-50}
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, 'import time,os; assert time.time()-os.stat("/tmp/market-worker-heartbeat").st_mtime < 90']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *logging
  market-stream:
    # Holds the only KIS WebSocket session the app key allows (US and Korean
    # trades share it); never scale up.
    build: .
    image: paper-trading-web
    command: [python, -m, app.trade_stream]
    environment:
      REDIS_URL: redis://redis:6379/0
      KIS_APP_KEY: ${KIS_APP_KEY:-}
      KIS_APP_SECRET: ${KIS_APP_SECRET:-}
      KOREA_MARKET_PROVIDER: ${KOREA_MARKET_PROVIDER:-kis}
      KOREA_MARKET_API_KEY: ${KOREA_MARKET_API_KEY:-}
      KOREA_MARKET_API_SECRET: ${KOREA_MARKET_API_SECRET:-}
      US_TRADE_STREAM_ENABLED: ${US_TRADE_STREAM_ENABLED:-true}
      KR_TRADE_STREAM_ENABLED: ${KR_TRADE_STREAM_ENABLED:-true}
      MARKET_STREAM_MAX_SUBSCRIPTIONS: ${MARKET_STREAM_MAX_SUBSCRIPTIONS:-3}
      MARKET_STREAM_RECONNECT_MAX_SECONDS: ${MARKET_STREAM_RECONNECT_MAX_SECONDS:-60}
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, 'import time,os; assert time.time()-os.stat("/tmp/trade-stream-heartbeat").st_mtime < 120']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
  nginx:
    image: nginx:1.28-alpine
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/health']
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging
volumes:
  pgdata:
  redis_data:
